[package]
name = "video-downloader"
version = "0.5.1"
edition = "2021"
default-run = "video-downloader"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[lib]
name = "video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri = { version = "2.11", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.7"

rusqlite = { version = "=0.32.1", features = ["bundled"] }

reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
base64 = "=0.23.1"

serde_yaml = "=0.9.34"
